server {
    listen 80;
    server_name foxname.top www.foxname.top;

    # Catch the hardcoded Roblox WebSocket requests and route to dummy server
    location /post/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Proxy everything else transparently to GitHub Pages
    # Visitors get the exact same GitHub Pages site, VPS just acts as a middleman
    location / {
        proxy_pass https://YOUR_GITHUB_USERNAME.github.io;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_GITHUB_USERNAME.github.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";

        # Cache static assets on the VPS to avoid hammering GitHub Pages
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
    }
}
